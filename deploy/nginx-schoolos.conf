server {
    listen 80;
    server_name school.example.com;
    root /var/www/schoolos/current/public;
    index index.php;
    client_max_body_size 20M;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up { access_log off; try_files $uri /index.php?$query_string; }
    location = /health/ready { access_log off; try_files $uri /index.php?$query_string; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\. { deny all; }
}
